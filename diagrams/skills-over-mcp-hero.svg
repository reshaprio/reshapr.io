<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="{{flow}}"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="{{shadow}}" flood-opacity="{{shadowOpacity}}"/></filter>
  </defs>
  <rect width="1672" height="941" fill="{{bg}}"/>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="340" height="370" rx="12" fill="{{card}}" stroke="{{cardActiveBorder}}"/>
  </g>
  <text x="88" y="198" font-size="26" font-weight="700" fill="{{text}}">AI agent</text>
  <rect x="258" y="172" width="114" height="36" rx="18" fill="{{badgeBg}}"/>
  <text x="315" y="196" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{badgeText}}">claude</text>
  <text x="88" y="250" font-size="18" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{muted}}">tools/call</text>
  <text x="88" y="290" font-size="18" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{muted}}">skills/list</text>
  <text x="88" y="330" font-size="18" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{muted}}">resources/read</text>
  <text x="88" y="392" font-size="18" fill="{{muted}}">Lists the skills, then reads</text>
  <text x="88" y="418" font-size="18" fill="{{muted}}">the one it needs, on demand</text>

  <rect x="560" y="70" width="500" height="720" rx="16" fill="{{boundaryFill}}" stroke="{{boundary}}" stroke-width="1.5" stroke-dasharray="8,6"/>
  <image x="588" y="80" width="44" height="44" href="data:image/png;base64,"/>
  <text x="646" y="116" font-size="24" font-weight="700" fill="{{text}}">reShapr</text>
  <text x="756" y="116" font-size="16" letter-spacing="1.5" fill="{{muted}}">MCP SERVER</text>

  <g filter="url(#shadow)">
    <rect x="590" y="150" width="440" height="150" rx="12" fill="{{card}}" stroke="{{cardBorder}}"/>
  </g>
  <text x="618" y="198" font-size="26" font-weight="700" fill="{{text}}">Tools</text>
  <rect x="866" y="172" width="142" height="36" rx="18" fill="{{badgeBg}}"/>
  <text x="937" y="196" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{badgeText}}">OpenAPI</text>
  <text x="618" y="240" font-size="18" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{muted}}">post_store_order</text>
  <text x="618" y="272" font-size="18" fill="{{muted}}">What the agent can call</text>

  <g filter="url(#shadow)">
    <rect x="590" y="370" width="440" height="150" rx="12" fill="{{card}}" stroke="{{cardActiveBorder}}"/>
  </g>
  <text x="618" y="418" font-size="26" font-weight="700" fill="{{text}}">Skills</text>
  <rect x="846" y="392" width="162" height="36" rx="18" fill="{{badgeBg}}"/>
  <text x="927" y="416" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{badgeText}}">kind: Skills</text>
  <text x="618" y="460" font-size="18" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{muted}}">skill://petstore-adoption-desk</text>
  <text x="618" y="492" font-size="18" fill="{{muted}}">How to use them, step by step</text>

  <g filter="url(#shadow)">
    <rect x="590" y="590" width="440" height="150" rx="12" fill="{{card}}" stroke="{{cardBorder}}"/>
  </g>
  <text x="618" y="638" font-size="26" font-weight="700" fill="{{text}}">Configuration Plan</text>
  <rect x="888" y="612" width="120" height="36" rx="18" fill="{{badgeBg}}"/>
  <text x="948" y="636" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{badgeText}}">governs</text>
  <text x="618" y="680" font-size="18" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{muted}}">include · exclude</text>
  <text x="618" y="712" font-size="18" fill="{{muted}}">What is visible to the agent</text>

  <g filter="url(#shadow)">
    <rect x="1190" y="150" width="420" height="150" rx="12" fill="{{card}}" stroke="{{cardBorder}}"/>
  </g>
  <text x="1218" y="198" font-size="26" font-weight="700" fill="{{text}}">Backend API</text>
  <text x="1218" y="240" font-size="18" fill="{{muted}}">example: Petstore</text>
  <text x="1218" y="272" font-size="18" fill="{{muted}}">public demo API</text>

  <g filter="url(#shadow)">
    <rect x="1190" y="370" width="420" height="150" rx="12" fill="{{card}}" stroke="{{cardActiveBorder}}"/>
  </g>
  <text x="1218" y="418" font-size="26" font-weight="700" fill="{{text}}">Skill host</text>
  <text x="1218" y="460" font-size="18" font-family="'JetBrains Mono', Menlo, Monaco, monospace" fill="{{muted}}">SKILL.md + references/</text>
  <text x="1218" y="492" font-size="18" fill="{{muted}}">Any HTTP server</text>

  <path d="M400,225 L584,225" stroke="{{flow}}" stroke-width="2.5" fill="none" marker-end="url(#arrFlow)"/>
  <text x="492" y="203" font-size="18" text-anchor="middle" fill="{{muted}}">tools/call</text>
  <path d="M400,445 L584,445" stroke="{{flow}}" stroke-width="2.5" fill="none" marker-end="url(#arrFlow)"/>
  <text x="492" y="423" font-size="18" text-anchor="middle" fill="{{muted}}">skills/list</text>
  <text x="492" y="478" font-size="16" text-anchor="middle" fill="{{muted}}">resources/read</text>

  <path d="M1030,225 L1180,225" stroke="{{flow}}" stroke-width="2.5" fill="none" marker-end="url(#arrFlow)"/>
  <text x="1105" y="203" font-size="18" text-anchor="middle" fill="{{muted}}">HTTP</text>
  <path d="M1180,445 L1036,445" stroke="{{flow}}" stroke-width="2.5" stroke-dasharray="7,6" fill="none" marker-end="url(#arrFlow)"/>
  <text x="1125" y="423" font-size="16" text-anchor="middle" fill="{{muted}}">fetch + cache</text>

  <text x="836" y="850" font-size="24" text-anchor="middle" fill="{{muted}}">Tools say what to call, skills say how: one governed MCP endpoint serves both</text>
</svg>
